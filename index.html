<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 虛擬病人問診模擬系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">🩺 AI 模擬問診系統 (Doctor Simulation)</h1>
    <button id="newPatientBtn" class="bg-blue-500 hover:bg-blue-700 px-3 py-1 rounded text-sm">🔄 換一位病人</button>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex overflow-hidden p-4 gap-4">
    
    <!-- 左側：病患資訊與對話紀錄 -->
    <section class="flex-1 bg-white rounded-lg shadow flex flex-col p-4">
      <div class="border-b pb-2 mb-4 flex justify-between items-center">
        <div>
          <h2 class="font-semibold text-gray-700">當前狀態：<span id="patientStatus" class="text-green-600">候診中...</span></h2>
        </div>
        <div id="voiceIndicator" class="hidden flex items-center gap-2 text-red-500 font-medium">
          <span class="animate-ping h-3 w-3 rounded-full bg-red-400 inline-block"></span> 正在聆聽醫生說話...
        </div>
      </div>

      <!-- 對話區域 -->
      <div id="chatBox" class="flex-1 overflow-y-auto space-y-4 p-2 bg-gray-50 rounded">
        <div class="text-center text-gray-400 text-sm">按下下方「開始語音對話」按鈕以開始問診</div>
      </div>

      <!-- 控制按鈕區 -->
      <div class="mt-4 flex gap-2">
        <button id="micBtn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg flex justify-center items-center gap-2 shadow">
          🎤 按住/點擊 開始說話 (醫生)
        </button>
      </div>
    </section>

    <!-- 右側：醫生問診筆記 (Medical Notes) -->
    <section class="w-80 bg-white rounded-lg shadow p-4 flex flex-col">
      <h3 class="font-bold text-gray-700 mb-2">📋 醫生問診筆記 (SOAP)</h3>
      <textarea class="w-full flex-1 border rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="在此紀錄主訴 (CC)、現病史 (HPI)、初步診斷..."></textarea>
      <button class="mt-4 bg-purple-600 text-white py-2 rounded font-medium hover:bg-purple-700">完成診斷與評估</button>
    </section>
  </main>

  <script>
    // === 設定與變數 ===
    const OPENAI_API_KEY = 'YOUR_OPENAI_API_KEY'; // ⚠️ 請填入你的 API Key
    
    let isListening = false;
    let recognition;
    let messagesHistory = [];

    // 病人 Persona 庫（可擴充隨機奇難雜症）
    const patientProfiles = [
      "你是一位35歲女性，隱藏病情是「偏頭痛與微血管性心絞痛」，症狀是左側頭痛伴隨胸悶，緊張時加重。請用口語、稍微虛弱的語氣回答。",
      "你是一位60歲男性，隱藏病情是「早期庫賈氏病 (CJD) 前兆或極度焦慮症」，最近常忘記事情，手部偶爾輕微震顫。性格多疑。",
      "你是一位22歲大學生，隱藏病情是「闌尾炎初期」，右下腹隱隱作痛，昨晚有發燒與嘔吐。講話簡短。"
    ];

    // 初始化 AI 設定
    function initPatient() {
      const randomProfile = patientProfiles[Math.floor(Math.random() * patientProfiles.length)];
      messagesHistory = [
        {
          role: "system",
          content: `${randomProfile} 
          注意：
          1. 你是病人，醫生問你問題時你才回答。
          2. 回答要短（20-40字以內），像正常人聊天一樣自然。
          3. 不要一次過把所有病情講出來！`
        }
      ];
      document.getElementById('chatBox').innerHTML = '<div class="text-center text-gray-400 text-sm">新病人已進入診室，請開始問診。</div>';
    }

    // === 1. 語音辨識 (Speech-to-Text) ===
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-HK'; // 設定為廣東話 (亦可設為 zh-TW 或 en-US)
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('voiceIndicator').classList.remove('hidden');
        document.getElementById('micBtn').classList.replace('bg-green-600', 'bg-red-600');
        document.getElementById('micBtn').innerText = '🛑 正在錄音... (再點擊停止)';
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('voiceIndicator').classList.add('hidden');
        document.getElementById('micBtn').classList.replace('bg-red-600', 'bg-green-600');
        document.getElementById('micBtn').innerText = '🎤 按住/點擊 開始說話 (醫生)';
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        appendMessage('醫生', transcript, 'user');
        await sendToAI(transcript);
      };
    } else {
      alert('你的瀏覽器不支援 Web Speech API，請使用 Chrome 瀏覽器。');
    }

    // 控制錄音按鈕
    document.getElementById('micBtn').addEventListener('click', () => {
      if (!isListening) {
        recognition.start();
      } else {
        recognition.stop();
      }
    });

    // === 2. 呼叫大語言模型 (LLM) ===
    async function sendToAI(userText) {
      messagesHistory.push({ role: "user", content: userText });

      try {
        // 使用 gpt-4o-mini 保證極低延遲
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: messagesHistory,
            temperature: 0.7,
            max_tokens: 150
          })
        });

        const data = await response.json();
        const aiReply = data.choices[0].message.content;

        messagesHistory.push({ role: "assistant", content: aiReply });
        appendMessage('病人', aiReply, 'assistant');
        
        // 3. 播放 AI 語音
        speakText(aiReply);

      } catch (err) {
        console.error("API Error:", err);
        appendMessage('系統', '連線失敗，請檢查 API Key。', 'system');
      }
    }

    // === 3. 語音輸出 (Text-to-Speech) ===
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // 停止先前的聲音
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK'; // 語音語言
        utterance.rate = 1.0;     // 語速
        window.speechSynthesis.speak(utterance);
      }
    }

    // 畫面更新輔助函式
    function appendMessage(sender, text, type) {
      const chatBox = document.getElementById('chatBox');
      const div = document.createElement('div');
      
      if (type === 'user') {
        div.className = 'flex justify-end';
        div.innerHTML = `<div class="bg-blue-600 text-white px-4 py-2 rounded-lg max-w-xs shadow"><p class="text-xs text-blue-200">👨‍⚕️ ${sender}</p>${text}</div>`;
      } else if (type === 'assistant') {
        div.className = 'flex justify-start';
        div.innerHTML = `<div class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg max-w-xs shadow"><p class="text-xs text-gray-500">🛌 ${sender}</p>${text}</div>`;
      }
      
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('newPatientBtn').addEventListener('click', initPatient);

    // 頁面載入時初始化
    initPatient();
  </script>
</body>
</html>
